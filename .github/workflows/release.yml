name: Build & Release
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: mvn clean package -DskipTests
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: target/media-handler.jar
