spring:
  ai:
    openai:
      api-key: ollama
      base-url: http://192.168.178.81:11434
      chat:
        options:
          model: qwen2.5:14b
    retry:
      max-attempts: 1   # disable Spring AI's built-in LLM retry — we handle retries ourselves

  application:
    name: media-handler

  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true   # browsers must revalidate UI files, so an update is picked up without a hard refresh

  datasource:
    url: jdbc:h2:file:./data/mediahandler;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  file:
    name: ./logs/mediahandler.log   # also read remotely via GET /actuator/logfile
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB

management:
  endpoints:
    web:
      exposure:
        include: logfile   # tail: curl -H 'Range: bytes=-100000' http://<host>:8080/actuator/logfile

media:
  source-folder: /mnt/nas/temp
  target-folder-movies: /mnt/nas/movies
  target-folder-shows: /mnt/nas/shows
  ignored-folders:       # inside the source folder; never scanned, renamed or deleted (editable in Settings)
    - usenet
  sample-max-mb: 200   # video files named "*sample*" up to this size are skipped, never processed (editable in Settings)
  file-extensions:
    - mkv
    - mp4
    - avi
    - m4v
    - mov
    - wmv
  cleanup-small-video-max-mb: 200   # folder cleanup deletes video files below this size (except episodes; editable in Settings)
  cleanup-interval-ms: 1800000   # how often to check for copy-mode source files due for deletion (default: 30 minutes)
  poll-interval-ms: 30000
  stability-threshold-seconds: 60
  tmdb:
    api-key: YOUR_TMDB_BEARER_TOKEN
    base-url: https://api.themoviedb.org/3
  llm:
    mode: local            # local = llama-server in this container; remote = spring.ai.openai.* / Anthropic endpoint
    local:
      server-binary: /opt/llama.cpp/llama-server
      model-path: /opt/mediahandler/models/qwen2.5-1.5b-instruct-q4_k_m.gguf
      model-name: qwen2.5-1.5b-instruct
      threads: 4                     # match the container's CPU cores
      port: 8081                     # bound to 127.0.0.1 only
      ctx-size: 2048
      idle-timeout-seconds: 600      # stop llama-server after 10 min idle; 0 = keep running
      startup-timeout-seconds: 120
      extra-args: ""                 # appended to the llama-server command line
  retry:
    enabled: false         # set to true to automatically retry failed records
    interval-ms: 300000   # retry failed records every 5 minutes
    max-attempts: 5        # give up after 5 total attempts
