<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediaHandler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">&#9654;</div>
    MediaHandler
  </div>
  <nav>
    <button class="nav-btn" id="nav-logs"     onclick="switchTab('logs')">Logs</button>
    <button class="nav-btn" id="nav-settings" onclick="switchTab('settings')">Settings</button>
  </nav>
</header>

<main>

  <!-- Logs tab -->
  <div class="tab" id="tab-logs">

    <div class="stats">
      <div class="stat">
        <div class="stat-label">Total</div>
        <div class="stat-value" id="stat-total">--</div>
      </div>
      <div class="stat">
        <div class="stat-label">Moved</div>
        <div class="stat-value success" id="stat-moved">--</div>
      </div>
      <div class="stat">
        <div class="stat-label">Failed</div>
        <div class="stat-value error" id="stat-failed">--</div>
      </div>
      <div class="stat">
        <div class="stat-label">Pending</div>
        <div class="stat-value pending" id="stat-pending">--</div>
      </div>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="ALL"     onclick="setFilter('ALL')">All</button>
      <button class="filter-btn"        data-filter="SUCCESS" onclick="setFilter('SUCCESS')">Success</button>
      <button class="filter-btn"        data-filter="FAILED"  onclick="setFilter('FAILED')">Failed</button>
      <button class="filter-btn"        data-filter="PENDING" onclick="setFilter('PENDING')">Pending</button>
    </div>

    <div class="card" style="padding: 0;">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Filename</th>
              <th>Status</th>
              <th>Created</th>
              <th>Last Attempt</th>
            </tr>
          </thead>
          <tbody id="records-tbody">
            <tr><td colspan="4" class="empty">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="detail-panel" id="detail-panel"></div>

  </div>

  <!-- Settings tab -->
  <div class="tab" id="tab-settings">

    <div class="card">
      <div class="card-title">Paths</div>
      <div class="settings-grid">
        <div class="field">
          <label>Source Folder</label>
          <input id="cfg-source-folder" type="text" placeholder="/media/downloads" />
        </div>
        <div class="field">
          <label>Target Folder</label>
          <input id="cfg-target-folder" type="text" placeholder="/media/library" />
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">TMDB</div>
      <div class="settings-grid">
        <div class="field">
          <label>API Key (Bearer Token)</label>
          <input id="cfg-tmdb-api-key" type="password" placeholder="eyJ..." />
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">LLM Provider</div>
      <div class="settings-grid">

        <div class="field">
          <label>Provider</label>
          <div class="provider-toggle">
            <button class="provider-btn" data-provider="openai"    onclick="selectProvider('openai', true)">OpenAI / Ollama</button>
            <button class="provider-btn" data-provider="anthropic" onclick="selectProvider('anthropic', true)">Anthropic</button>
          </div>
        </div>

        <div class="field">
          <label>API Key</label>
          <input id="cfg-llm-api-key" type="password" placeholder="sk-... or ollama" />
        </div>

        <div id="openai-fields" class="field">
          <label>Base URL</label>
          <input id="cfg-llm-base-url" type="text" placeholder="http://localhost:11434" />
        </div>

        <div class="field">
          <label>Model</label>
          <input id="cfg-llm-model" type="text" placeholder="qwen2.5:14b" />
        </div>

      </div>
    </div>

    <button class="save-btn" onclick="saveSettings()">Save Settings</button>

  </div>

</main>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
